name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: fileinfo, intl, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run the test suite
        run: php artisan test --compact

      - name: Check formatting
        run: vendor/bin/pint --test --format agent

      - name: Check automated refactors
        run: composer rector:dry

      - name: Run static analysis
        run: composer analyse

      - name: Analyze API documentation
        run: php artisan scramble:analyze

      - name: Audit dependencies
        run: composer audit --abandoned=report --no-interaction
